name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable  # rustc parses the Rust snippets
      - run: npm install -g typescript@5  # tsc's parser checks the TypeScript snippets
      - name: Validate corpus and catalog freshness
        run: uv run validate.py

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable  # the validator tests call rustc
      - run: npm install -g typescript@5  # and tsc's parser
      - name: Test the MCP server
        run: uv run pytest -q
