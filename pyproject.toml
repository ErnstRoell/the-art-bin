[project]
name = "art-bin-server"
version = "0.1.0"
description = "MCP server exposing The Art Bin corpus of Python code smells"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.2",
    "packaging>=24",
    "pyyaml>=6",
]

[project.scripts]
art-bin-server = "art_bin_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/art_bin_server"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
